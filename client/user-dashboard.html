<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | ClayVista Luxury Tableware</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .dashboard-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 40px;
      padding: 40px 0 80px;
      align-items: start;
    }
    .dashboard-nav-card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .dashboard-user-header {
      padding: 24px;
      text-align: center;
      background: var(--color-secondary);
      border-bottom: 1px solid var(--color-border);
    }
    .dash-nav-links {
      display: flex;
      flex-direction: column;
    }
    .dashboard-nav-item {
      padding: 14px 20px;
      border-bottom: 1px solid var(--color-border-light);
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    .dashboard-nav-item:hover, .dashboard-nav-item.active {
      background: var(--color-accent-soft);
      color: var(--color-accent);
      padding-left: 24px;
    }
    .dashboard-box {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 32px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div id="scroll-progress"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar-inner">
      <a href="/index.html" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 4 6 4 11c0 4.5 3 8 8 11 5-3 8-6.5 8-11 0-5-4-9-8-9zm0 17.5c-3.6-2.6-6-5.4-6-8.5 0-3.6 2.7-6.5 6-6.5s6 2.9 6 6.5c0 3.1-2.4 5.9-6 8.5z"/></svg>
        <div><span>ClayVista</span><span class="brand-tagline">Crafting Elegance in Every Piece</span></div>
      </a>
      <nav class="nav-menu">
        <a href="/index.html" class="nav-link">Home</a>
        <a href="/shop.html" class="nav-link">Shop Collection</a>
        <a href="/categories.html" class="nav-link">Categories</a>
        <a href="/contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="action-btn" title="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span class="badge-count" id="cart-badge-count" style="display: none;">0</span>
        </a>
        <button class="btn btn-sm btn-outline" onclick="logoutUser()">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="dashboard-layout">
      <!-- Left Sidebar Nav -->
      <aside>
        <div class="dashboard-nav-card">
          <div class="dashboard-user-header">
            <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--color-accent); color: #FFF; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
              CV
            </div>
            <h3 id="dash-welcome-name" style="font-family: var(--font-serif); font-size: 1.2rem; font-weight: 600;">Welcome</h3>
            <span id="dash-email-display" style="font-size: 0.78rem; color: var(--color-text-muted);"></span>
          </div>
          <div class="dash-nav-links">
            <button class="dashboard-nav-item active" data-tab="orders">📦 My Orders</button>
            <button class="dashboard-nav-item" data-tab="profile">👤 Personal Profile</button>
            <button class="dashboard-nav-item" data-tab="addresses">📍 Saved Addresses</button>
            <button class="dashboard-nav-item" data-tab="wishlist">♥ Saved Wishlist</button>
            <button class="dashboard-nav-item" data-tab="password">🔒 Security & Password</button>
            <button class="dashboard-nav-item" onclick="logoutUser()" style="color: #D32F2F;">🚪 Sign Out</button>
          </div>
        </div>
      </aside>

      <!-- Right Tab Content -->
      <section>
        <!-- Tab 1: Orders -->
        <div class="dashboard-tab-content" id="tab-orders">
          <div class="dashboard-box">
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 20px;">My Order History</h2>
            <div id="dash-orders-list"></div>
          </div>
        </div>

        <!-- Tab 2: Profile -->
        <div class="dashboard-tab-content" id="tab-profile" style="display: none;">
          <div class="dashboard-box">
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 20px;">Personal Profile</h2>
            <form id="dash-profile-form">
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">Full Name</label>
                  <input type="text" id="profile-name-input" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Phone Number</label>
                  <input type="tel" id="profile-phone-input" class="form-input">
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top: 16px;">Save Changes</button>
            </form>
          </div>
        </div>

        <!-- Tab 3: Saved Addresses -->
        <div class="dashboard-tab-content" id="tab-addresses" style="display: none;">
          <div class="dashboard-box">
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 20px;">Saved Addresses</h2>
            <div id="dash-addresses-list"></div>

            <h3 style="font-family: var(--font-serif); font-size: 1.3rem; margin: 32px 0 16px;">Add New Address</h3>
            <form id="dash-add-address-form">
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">Full Name *</label>
                  <input type="text" id="addr-name" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Phone Number *</label>
                  <input type="tel" id="addr-phone" class="form-input" required>
                </div>
                <div class="form-group full-width">
                  <label class="form-label">Street Address *</label>
                  <input type="text" id="addr-street" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Apartment / Suite</label>
                  <input type="text" id="addr-apt" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">City *</label>
                  <input type="text" id="addr-city" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label">State *</label>
                  <input type="text" id="addr-state" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Postal Pincode *</label>
                  <input type="text" id="addr-pincode" maxlength="6" class="form-input" required>
                </div>
                <div class="form-group full-width">
                  <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="addr-default" style="accent-color: var(--color-accent);"> Set as primary delivery address
                  </label>
                </div>
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top: 16px;">Save New Address</button>
            </form>
          </div>
        </div>

        <!-- Tab 4: Wishlist -->
        <div class="dashboard-tab-content" id="tab-wishlist" style="display: none;">
          <div class="dashboard-box">
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 20px;">My Saved Pieces</h2>
            <div class="product-grid" id="dash-wishlist-grid"></div>
          </div>
        </div>

        <!-- Tab 5: Security & Password -->
        <div class="dashboard-tab-content" id="tab-password" style="display: none;">
          <div class="dashboard-box">
            <h2 style="font-family: var(--font-serif); font-size: 1.6rem; margin-bottom: 20px;">Change Password</h2>
            <form id="dash-change-password-form" style="max-width: 480px;">
              <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" id="current-password-input" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label">New Password (Min 6 Characters)</label>
                <input type="password" id="new-password-input" class="form-input" required minlength="6">
              </div>
              <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirm-password-input" class="form-input" required minlength="6">
              </div>
              <button type="submit" class="btn btn-primary" style="margin-top: 16px;">Update Password</button>
            </form>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>© 2026 ClayVista Tableware. Premium Porcelain & Chinaware.</div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
