<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ClayVista Luxury Tableware</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="scroll-progress"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar-inner" style="justify-content: center;">
      <a href="/index.html" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 4 6 4 11c0 4.5 3 8 8 11 5-3 8-6.5 8-11 0-5-4-9-8-9zm0 17.5c-3.6-2.6-6-5.4-6-8.5 0-3.6 2.7-6.5 6-6.5s6 2.9 6 6.5c0 3.1-2.4 5.9-6 8.5z"/></svg>
        <div><span>ClayVista</span><span class="brand-tagline">Crafting Elegance in Every Piece</span></div>
      </a>
    </div>
  </header>

  <main class="container" style="padding: 60px 20px 80px; max-width: 480px;">
    <div style="background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 36px; box-shadow: var(--shadow-md);">
      <h1 style="font-family: var(--font-serif); font-size: 2rem; font-weight: 700; margin-bottom: 8px; text-align: center;">Welcome Back</h1>
      <p style="color: var(--color-text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 24px;">Sign in to access your orders, saved tableware, and wishlist.</p>

      <!-- Quick Demo Account Fillers -->
      <div style="background: var(--color-secondary); padding: 14px; border-radius: var(--radius-sm); margin-bottom: 24px; text-align: center; border: 1px dashed var(--color-accent);">
        <span style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: var(--color-accent); font-weight: 600;">Fast Demo Evaluation</span>
        <div style="display: flex; gap: 8px; justify-content: center; margin-top: 8px;">
          <button type="button" id="fill-demo-customer" class="btn btn-sm btn-outline">Demo Customer</button>
          <button type="button" id="fill-demo-admin" class="btn btn-sm btn-accent">Master Admin</button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password.html" style="font-size: 0.8rem; color: var(--color-accent);">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--color-text-muted);">
        Don't have an account yet? <a href="/register.html" style="color: var(--color-accent); font-weight: 600;">Create One →</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>© 2026 ClayVista Tableware. Handcrafted with pride in India.</div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
