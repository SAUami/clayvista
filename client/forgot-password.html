<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Recovery | ClayVista Luxury Tableware</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="scroll-progress"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar-inner" style="justify-content: center;">
      <a href="/index.html" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 4 6 4 11c0 4.5 3 8 8 11 5-3 8-6.5 8-11 0-5-4-9-8-9zm0 17.5c-3.6-2.6-6-5.4-6-8.5 0-3.6 2.7-6.5 6-6.5s6 2.9 6 6.5c0 3.1-2.4 5.9-6 8.5z"/></svg>
        <div><span>ClayVista</span><span class="brand-tagline">Crafting Elegance in Every Piece</span></div>
      </a>
    </div>
  </header>

  <main class="container" style="padding: 60px 20px 80px; max-width: 480px;">
    <div style="background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 36px; box-shadow: var(--shadow-md);">
      <h1 style="font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; text-align: center;">Reset Password</h1>
      <p style="color: var(--color-text-muted); font-size: 0.88rem; text-align: center; margin-bottom: 24px;">Follow the 3-step secure verification to recover your ClayVista account.</p>

      <!-- Step 1: Send OTP -->
      <form id="forgot-password-form">
        <div class="form-group">
          <label class="form-label">Registered Email Address</label>
          <input type="email" id="forgot-email" class="form-input" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">Send Verification OTP</button>
      </form>

      <!-- Step 2: Verify OTP -->
      <form id="verify-otp-form" style="display: none;">
        <div style="background: var(--color-secondary); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 0.85rem;">
          Verification code dispatched to: <strong id="otp-target-email"></strong>
        </div>
        <div class="form-group">
          <label class="form-label">6-Digit Verification Code</label>
          <input type="text" id="otp-code-input" class="form-input" maxlength="6" required placeholder="123456" style="text-align: center; letter-spacing: 6px; font-size: 1.4rem; font-weight: bold;">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">Verify Code</button>
      </form>

      <!-- Step 3: Set New Password -->
      <form id="reset-password-form" style="display: none;">
        <div class="form-group">
          <label class="form-label">New Password (Min 6 Characters)</label>
          <input type="password" id="reset-new-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="reset-confirm-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">Update Password & Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem;">
        <a href="/login.html" style="color: var(--color-accent);">← Return to Sign In</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>© 2026 ClayVista Tableware. Handcrafted with pride in India.</div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
