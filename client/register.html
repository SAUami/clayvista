<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | ClayVista Luxury Tableware</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div id="scroll-progress"></div>

  <!-- Header -->
  <header class="site-header">
    <div class="container navbar-inner" style="justify-content: center;">
      <a href="/index.html" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 2C8 2 4 6 4 11c0 4.5 3 8 8 11 5-3 8-6.5 8-11 0-5-4-9-8-9zm0 17.5c-3.6-2.6-6-5.4-6-8.5 0-3.6 2.7-6.5 6-6.5s6 2.9 6 6.5c0 3.1-2.4 5.9-6 8.5z"/></svg>
        <div><span>ClayVista</span><span class="brand-tagline">Crafting Elegance in Every Piece</span></div>
      </a>
    </div>
  </header>

  <main class="container" style="padding: 50px 20px 80px; max-width: 520px;">
    <div style="background: var(--color-card-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 36px; box-shadow: var(--shadow-md);">
      <h1 style="font-family: var(--font-serif); font-size: 2rem; font-weight: 700; margin-bottom: 8px; text-align: center;">Join ClayVista</h1>
      <p style="color: var(--color-text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 24px;">Create an account to track shipments, curate wishlists, and receive exclusive studio invitations.</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-input" required placeholder="e.g. Priya Sharma">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="reg-email" class="form-input" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-input" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label class="form-label">Password * (Min 6 Characters)</label>
          <input type="password" id="reg-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-input" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 14px;">Create Account</button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--color-text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--color-accent); font-weight: 600;">Sign In →</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>© 2026 ClayVista Tableware. Handcrafted with pride in India.</div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
